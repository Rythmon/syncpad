version: '3.8'

services:
  # Redis Pub/Sub Cluster Coordinator
  redis:
    image: redis:7-alpine
    container_name: syncpad-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # SyncPad Real-Time CRDT WebSocket Gateway
  syncpad-ws-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: syncpad-ws-server
    restart: unless-stopped
    environment:
      - PORT=1234
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    ports:
      - "1234:1234"
    depends_on:
      redis:
        condition: service_healthy

  # SyncPad Next.js Frontend Application
  syncpad-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: syncpad-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:1234
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - syncpad-ws-server

volumes:
  redis_data:
